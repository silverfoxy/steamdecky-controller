name: Validate Steamy Controller

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Check Python and shell syntax
        run: |
          python -m py_compile deck-controller-gui.py deck_services.py pc-scripts/discover_deck.py
          bash -n pc-scripts/pc-connect.sh pc-scripts/pc-disconnect.sh
      - name: Test Deck and Linux client behavior
        run: python -m pytest -q tests
